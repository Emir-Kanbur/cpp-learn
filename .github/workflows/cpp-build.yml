name: C++ Build Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: C++17 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check examples
        env:
          CXX: ${{ matrix.compiler }}
        run: bash scripts/check-build.sh
