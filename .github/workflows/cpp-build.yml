name: C++ Build Check

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile all C++ files
        run: |
          set -e
          mkdir -p /tmp/cpp-build

          while IFS= read -r -d '' file; do
            output="/tmp/cpp-build/$(echo "$file" | tr '/ +' '___').out"
            echo "Compiling: $file"
            g++ -std=c++17 "$file" -o "$output"
          done < <(find . -type f -name "*.cpp" -print0)
